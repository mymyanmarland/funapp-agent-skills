<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Funapp Agent Skills banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1026">
        <animate attributeName="stop-color" values="#0b1026;#1e1b4b;#0b1026" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#312e81">
        <animate attributeName="stop-color" values="#312e81;#6d28d9;#312e81" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0ea5a5">
        <animate attributeName="stop-color" values="#0ea5a5;#0b1026;#0ea5a5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="90" fill="#fbbf24" opacity="0.18">
    <animate attributeName="cy" values="70;90;70" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="330" r="70" fill="#ffffff" opacity="0.10">
    <animate attributeName="cx" values="120;150;120" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="320" r="40" fill="#fbbf24" opacity="0.25">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="90" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#fde68a">FUNAPP</text>
  <text x="70" y="170" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Agent Skills</text>
  <text x="70" y="225" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e0e7ff">Spec → Ship, the Funapp way</text>
  <text x="70" y="265" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c7d2fe">25 skills · 9 commands · Funapp rules on top of a proven upstream pack</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="70" y="295" width="130" height="40" rx="20" fill="#fbbf24"/>
    <text x="135" y="321" fill="#111827">DEFINE</text>
    <rect x="220" y="295" width="110" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="275" y="321" fill="#111827">PLAN</text>
    <rect x="350" y="295" width="110" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="405" y="321" fill="#111827">BUILD</text>
    <rect x="480" y="295" width="120" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="540" y="321" fill="#111827">VERIFY</text>
    <rect x="620" y="295" width="120" height="40" rx="20" fill="#ffffff" opacity="0.92"/>
    <text x="680" y="321" fill="#111827">REVIEW</text>
    <rect x="760" y="295" width="100" height="40" rx="20" fill="#fbbf24"/>
    <text x="810" y="321" fill="#111827">SHIP</text>
  </g>
</svg>
