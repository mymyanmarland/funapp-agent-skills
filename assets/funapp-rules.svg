<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Funapp rules">
<rect width="1200" height="340" fill="#f8fafc"/>
<g><rect x="20" y="20" width="275" height="130" rx="18" fill="#0b1026"/><text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Responsive</text><text x="40" y="100" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">PC + phone, one build</text></g>
<g><rect x="315" y="20" width="275" height="130" rx="18" fill="#312e81"/><text x="335" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Tabbed pages</text><text x="335" y="100" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">No long single scroll</text></g>
<g><rect x="610" y="20" width="275" height="130" rx="18" fill="#0b1026"/><text x="630" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Rich visuals</text><text x="630" y="100" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">Full, not sparse</text></g>
<g><rect x="905" y="20" width="275" height="130" rx="18" fill="#312e81"/><text x="925" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">In-chat delivery</text><text x="925" y="100" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">Attach, not link only</text></g>
<g><rect x="20" y="170" width="275" height="130" rx="18" fill="#0b1026"/><text x="40" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Myanmar font</text><text x="40" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">Ask via options first</text></g>
<g><rect x="315" y="170" width="275" height="130" rx="18" fill="#312e81"/><text x="335" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Proofreader gate</text><text x="335" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">Burmese checked first</text></g>
<g><rect x="610" y="170" width="275" height="130" rx="18" fill="#0b1026"/><text x="630" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Security first</text><text x="630" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">Auth every endpoint</text></g>
<g><rect x="905" y="170" width="275" height="130" rx="18" fill="#312e81"/><text x="925" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">Domain asked</text><text x="925" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e0e7ff">Never pick silently</text></g>

</svg>