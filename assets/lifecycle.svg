<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Funapp lifecycle: spec, plan, build, test, review, ship">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="170" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="20" y="50" width="160" height="64" rx="16" fill="#0b1026"/>
    <text x="100" y="88" fill="#ffffff">/spec</text>
    <rect x="210" y="50" width="160" height="64" rx="16" fill="#312e81"/>
    <text x="290" y="88" fill="#ffffff">/plan</text>
    <rect x="400" y="50" width="160" height="64" rx="16" fill="#0ea5a5"/>
    <text x="480" y="88" fill="#ffffff">/build</text>
    <rect x="590" y="50" width="160" height="64" rx="16" fill="#312e81"/>
    <text x="670" y="88" fill="#ffffff">/test</text>
    <rect x="780" y="50" width="160" height="64" rx="16" fill="#0b1026"/>
    <text x="860" y="88" fill="#ffffff">/review</text>
    <rect x="970" y="50" width="160" height="64" rx="16" fill="#f59e0b"/>
    <text x="1050" y="88" fill="#111827">/ship</text>
  </g>
  <g stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)">
    <line x1="180" y1="82" x2="210" y2="82"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="370" y1="82" x2="400" y2="82"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="560" y1="82" x2="590" y2="82"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="750" y1="82" x2="780" y2="82"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="940" y1="82" x2="970" y2="82"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.2s" repeatCount="indefinite"/></line>
  </g>
  <text x="600" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#475569">Verified at every step — never report success from a code change alone.</text>
</svg>
